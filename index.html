<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>koreasnakefish — TOPIK I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Latin = Inter, Thai = Prompt (Regular), Korean = Gowun -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@400&family=Gowun+Dodum&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  /* Light = warm white + navy blue · Dark = charcoal smoke (สีเรียบ ไม่ไล่สี) + baby blue · ถูก/ผิด = เขียว/แดง · Tier = สีมาตรฐาน */
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F2EEE6; --text:#1F2433; --muted:#6A6E7C; --border:#E6E0D4;
  --accent:#1B2A5C; --accent-soft:#E4E8F2; --on-accent:#FFFFFF;
  --tA:#C62828; --tA-bg:#FDE7E7; --tB:#B26A00; --tB-bg:#FFF1D6; --tC:#2E7D32; --tC-bg:#E3F4E4; --tD:#616161; --tD-bg:#EEEEEE;
  --ok:#1E8E3E; --bad:#D93025; --hero:linear-gradient(135deg,var(--accent-soft),var(--surface));
  --ko:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --ko-display:'Gowun Batang','Nanum Myeongjo',serif;
  --ui:'Inter','Prompt','Segoe UI',system-ui,sans-serif;
  --radius:14px; --shadow:0 1px 2px rgba(31,36,51,.06),0 4px 16px rgba(31,36,51,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1F22; --surface:#25292D; --surface-2:#2E3338; --text:#ECEFF1; --muted:#A3ACB5; --border:#3A4046;
    --accent:#89CFF0; --accent-soft:#2A3A45; --on-accent:#0E1E28; --hero:var(--surface);
    --tA:#FF8A80; --tA-bg:#47282B; --tB:#FFCC80; --tB-bg:#463B2A; --tC:#A5D6A7; --tC-bg:#283D31; --tD:#CFD4D9; --tD-bg:#383E44;
    --ok:#81C995; --bad:#F28B82; --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
    --bg:#1C1F22; --surface:#25292D; --surface-2:#2E3338; --text:#ECEFF1; --muted:#A3ACB5; --border:#3A4046;
    --accent:#89CFF0; --accent-soft:#2A3A45; --on-accent:#0E1E28; --hero:var(--surface);
    --tA:#FF8A80; --tA-bg:#47282B; --tB:#FFCC80; --tB-bg:#463B2A; --tC:#A5D6A7; --tC-bg:#283D31; --tD:#CFD4D9; --tD-bg:#383E44;
    --ok:#81C995; --bad:#F28B82; --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.ko{font-family:var(--ko)}
.th{font-family:'Prompt',var(--ui);font-weight:400}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-family:var(--ko-display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo small{font-family:var(--ui);font-weight:600;font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.theme-btn{margin-left:auto;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;display:flex;gap:6px;align-items:center}
nav.tabs{max-width:980px;margin:0 auto;display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.tab:hover:not([aria-current="page"]){background:var(--surface-2);color:var(--text)}

main{max-width:980px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.55rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}

/* shared */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:.85rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;display:inline-flex;gap:6px;align-items:center;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.chip .star{font-weight:700}
.chip.tA .star{color:var(--tA)} .chip.tB .star{color:var(--tB)} .chip.tC .star{color:var(--tC)} .chip.tD .star{color:var(--tD)}
.chip.tA[aria-pressed="true"]{background:var(--tA-bg);border-color:var(--tA);color:var(--tA)}
.chip.tB[aria-pressed="true"]{background:var(--tB-bg);border-color:var(--tB);color:var(--tB)}
.chip.tC[aria-pressed="true"]{background:var(--tC-bg);border-color:var(--tC);color:var(--tC)}
.chip.tD[aria-pressed="true"]{background:var(--tD-bg);border-color:var(--tD);color:var(--tD)}
.chip[class*=" t"][aria-pressed="true"] .stat{color:inherit;opacity:.8}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tier{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tier.A{color:var(--tA);background:var(--tA-bg)} .tier.B{color:var(--tB);background:var(--tB-bg)}
.tier.C{color:var(--tC);background:var(--tC-bg)} .tier.D{color:var(--tD);background:var(--tD-bg)}
.pos{font-size:.74rem;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 7px;white-space:nowrap}
.say{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;flex:none;position:relative;font-size:.95rem}
.say:hover{border-color:var(--accent)}
.say.playing{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.say.slow::after{content:"slow";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:.56rem;font-weight:700;background:var(--accent);color:var(--on-accent);border-radius:6px;padding:0 4px;line-height:1.5;letter-spacing:.02em}
.say.sm{width:28px;height:28px;font-size:.8rem}
u.hl{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700}
.ex .tr{font-size:.86rem;margin-top:2px}
.ex .tr .en{color:var(--muted)}
.stat{font-size:.78rem;color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:.88rem;z-index:50;max-width:min(92vw,560px);box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 14px;font-size:.88rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
input[type=search],select{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
input[type=search]{flex:1 1 220px}
.label{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* vocab list (collapsible) */
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 98px);z-index:10;background:var(--bg);padding:10px 0;display:grid;gap:10px}
.vlist{display:grid;gap:8px}
.vitem{padding:0;overflow:hidden}
.vsum{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;list-style:none;flex-wrap:wrap}
.vsum::-webkit-details-marker{display:none}
.rank{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.vword{font-family:var(--ko);font-size:1.45rem;line-height:1.3}
.vbody{padding:12px 16px 16px 64px;border-top:1px solid var(--border);display:grid;gap:10px}
.means{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.means .v{font-size:1.02rem}
.exs{display:grid;gap:6px}
.ex{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:7px 10px}
.ex .s{font-family:var(--ko);font-size:1rem}
.ex .src{font-size:.74rem;color:var(--muted)}
.chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
details[open]>summary .chev{transform:rotate(180deg)}
.more{display:flex;justify-content:center;padding:18px}

/* flashcard */
.fc-wrap{display:grid;gap:14px;max-width:560px;margin:0 auto}
.fc{perspective:1200px;min-height:360px}
.fc-inner{position:relative;width:100%;min-height:360px;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer}
.fc-back{transform:rotateY(180deg);justify-content:flex-start;overflow:auto}
.fc-word{font-family:var(--ko-display);font-size:clamp(2.4rem,9vw,3.4rem);line-height:1.2}
.fc-hint{font-size:.8rem;color:var(--muted)}
.fc-mean{font-size:1.3rem}
.fc-nav{display:flex;gap:8px;justify-content:space-between;align-items:center}
.fc-grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc-grade .no{border-color:var(--bad);color:var(--bad)}
.fc-grade .yes{border-color:var(--ok);color:var(--ok)}
.kbd{font-size:.72rem;color:var(--muted)}

/* grammar */
.glist{display:grid;gap:10px}
.gitem{padding:0;overflow:hidden}
.gsum{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;list-style:none}
.gsum::-webkit-details-marker{display:none}
.gpat{font-family:var(--ko);font-size:1.2rem;font-weight:700}
.gbody{padding:12px 16px 16px;display:grid;gap:10px;border-top:1px solid var(--border)}
.gform{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:.92rem}

/* quiz */
.quiz{max-width:620px;margin:0 auto;display:grid;gap:14px}
.qcard{padding:22px;display:grid;gap:16px}
.qprompt{font-size:1.2rem;text-align:center}
.qprompt .big{font-family:var(--ko);font-size:2.1rem;display:block}
.qopts{display:grid;gap:8px}
.qopt{text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:1rem}
.qopt:hover:not(:disabled){border-color:var(--accent)}
.qopt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.qopt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.qopt:disabled{cursor:default}
.qfeed{text-align:center;font-size:.92rem;color:var(--muted);min-height:1.4em}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{padding:16px;text-align:left;display:grid;gap:4px;border:1px solid var(--border)}
.mode b{font-size:1rem}
.mode span{font-size:.84rem;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* menu (home) */
.hero{padding:22px;display:grid;gap:14px;background:var(--hero)}
.hero h1{font-family:var(--ko-display)}
.section{margin-top:22px}
.qlink{padding:16px;display:grid;gap:4px;text-align:left;border:1px solid var(--border)}
.qlink b{font-size:1rem}
.qlink span{color:var(--muted);font-size:.85rem}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600}
.step.on{background:var(--accent);color:var(--on-accent)}
.step.done{background:var(--tC-bg);color:var(--tC)}

/* number line */
.nl{padding:18px 18px 14px;display:grid;gap:10px}
.nl-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nl-big{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.nl-track{position:relative;height:14px;border-radius:99px;display:flex;overflow:hidden;margin-top:30px}
.nl-track>span{height:100%}
.nl-track .sA{background:var(--tA-bg)} .nl-track .sB{background:var(--tB-bg)} .nl-track .sC{background:var(--tC-bg)} .nl-track .sD{background:var(--tD-bg)}
.nl-wrap{position:relative}
.nl-fill{position:absolute;left:0;top:30px;height:14px;border-radius:99px;background:var(--accent);opacity:.9;transition:width .4s;min-width:4px}
.nl-marker{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;gap:0;transition:left .4s}
.nl-marker b{font-size:.72rem;background:var(--accent);color:var(--on-accent);padding:1px 7px;border-radius:6px;white-space:nowrap}
.nl-marker i{width:2px;height:10px;background:var(--accent)}
.nl-ticks{position:relative;height:34px}
.nl-tick{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.nl-tick::before{content:"";width:1px;height:6px;background:var(--muted);margin-bottom:2px}
.nl-tick:first-child{transform:none;justify-items:start}
.nl-tick:last-child{transform:translateX(-100%);justify-items:end}
.nl-legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.help{font-size:.86rem;display:grid;gap:4px;margin:0;padding-left:18px}
.lbadge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--text);white-space:nowrap}
.src-link{font-size:.76rem;color:var(--accent);text-decoration:none}
.src-link:hover{text-decoration:underline}
.passage{background:var(--surface-2);border-radius:10px;padding:10px 14px;text-align:left;font-family:var(--ko);white-space:pre-line;font-size:1rem;line-height:1.7}
.ins{font-family:var(--ko);font-size:.92rem;color:var(--muted);text-align:left}
.qstem{font-family:var(--ko);text-align:left;white-space:pre-line;font-size:1.05rem}
.warnb{font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--tB-bg);color:var(--tB);font-weight:700}
.typebar{height:6px;border-radius:99px;background:var(--accent);opacity:.8}
footer{max-width:980px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.8rem}
@media (max-width:560px){
  .vword{font-size:1.25rem}
  .toolbar{position:static}
  .vbody{padding-left:16px}
  .rank{min-width:30px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">🐍 koreasnakefish <small>TOPIK I</small></div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle light / dark mode"></button>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="home">Menu</button>
    <button class="tab" data-tab="vocab">Vocabulary</button>
    <button class="tab" data-tab="grammar">Grammar</button>
    <button class="tab" data-tab="practice">Practice</button>
  </nav>
</header>
<main id="app"></main>
<footer id="foot"></footer>

/* helpers */
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const TH = s => `<span class="th">${esc(s)}</span>`;                    // ข้อความไทย = Prompt Regular
const meaningText = w => w.th ? `${w.th} · ${w.en}` : w.en;             // ใช้ในตัวเลือกแบบทดสอบ
function toast(html, ms = 4000) {
  const t = document.getElementById("toast");
  t.innerHTML = html; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
}
const tierBadge = t => `<span class="tier ${t}" title="${TIERS[t].desc}">${TIERS[t].star} ${TIERS[t].label}</span>`;
const sayBtn = (text, sm = false) =>
  `<button class="say${sm ? " sm" : ""}${Speech.count(text) ? " slow" : ""}" data-say="${esc(text)}" aria-label="Play: ${esc(text)}" title="1st tap = normal speed · next taps = slower">🔊</button>`;
// ขีดเส้นใต้คำศัพท์ในประโยค (ตำแหน่ง u = [start, end] คำนวณไว้ล่วงหน้าด้วย Kiwi จึงรองรับรูปผัน เช่น 가다 → 갔습니다)
function underline(e) {
  if (!e.u) return esc(e.ko);
  const [a, b] = e.u;
  return esc(e.ko.slice(0, a)) + `<u class="hl">${esc(e.ko.slice(a, b))}</u>` + esc(e.ko.slice(b));
}
function exampleHTML(e) {
  return `<div class="ex">${sayBtn(e.ko, true)}<div>
    <div class="s">${underline(e)}</div>
    ${e.th ? `<div class="tr">${TH(e.th)}<div class="en">${esc(e.en)}</div></div>` : `<div class="tr stat">Translation not available yet</div>`}
    <div class="src">TOPIK I · Exam ${esc(e.src.replace(/\D/g, ""))} · © NIIED</div></div></div>`;
}

/* ======================================================
   AUDIO — Web Speech API
   ครั้งแรก = ความเร็วปกติ, ครั้งต่อไป = ช้าลง
   แก้ปัญหาไม่มีเสียง: Chrome มักทิ้งเสียงถ้าเรียก speak() ทันทีหลัง cancel()
   ====================================================== */
const Speech = {
  ok: "speechSynthesis" in window, voices: [], voice: null, counts: new Map(),
  pref: store.get("ksf-voice", ""),
  init() {
    if (!this.ok) return;
    const load = () => {
      this.voices = speechSynthesis.getVoices();
      const ko = this.koVoices();
      this.voice = ko.find(v => v.name === this.pref) || ko.find(v => /google|online|natural/i.test(v.name)) || ko[0] || null;
    };
    load();
    speechSynthesis.addEventListener?.("voiceschanged", load);
    setTimeout(load, 600); setTimeout(load, 2500);
  },
  koVoices() { return this.voices.filter(v => /^ko/i.test(v.lang) || /korean|한국/i.test(v.name)); },
  setVoice(name) { this.pref = name; store.set("ksf-voice", name); this.voice = this.koVoices().find(v => v.name === name) || this.voice; },
  count(text) { return this.counts.get(text) || 0; },
  play(text, {force} = {}) {
    if (!this.ok) return audioProblem("unsupported");
    const n = this.count(text);
    if (!force) this.counts.set(text, n + 1);
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    u.rate = n === 0 || force ? 1.0 : 0.6;
    if (this.voice) u.voice = this.voice;
    const btns = [...document.querySelectorAll(".say")].filter(b => b.dataset.say === text);
    btns.forEach(b => b.classList.add("playing", "slow"));
    const done = () => btns.forEach(b => b.classList.remove("playing"));
    let started = false;
    u.onstart = () => { started = true; };
    u.onend = done;
    u.onerror = e => { done(); if (!["interrupted", "canceled"].includes(e.error)) audioProblem(e.error); };
    const go = () => {
      speechSynthesis.resume();                // Chrome บางครั้งค้างอยู่ในสถานะ paused
      speechSynthesis.speak(u);
      setTimeout(() => { if (!started && !speechSynthesis.speaking) { done(); audioProblem(this.voice ? "silent" : "novoice"); } }, 3000);
    };
    if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(go, 120); }
    else go();
  },
};
function audioProblem(reason) {
  const msg = {
    unsupported: "เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง — ลองใช้ Chrome, Edge หรือ Safari",
    novoice: "ไม่พบเสียงภาษาเกาหลีในเครื่อง — ติดตั้งเสียงเกาหลีในการตั้งค่าระบบ (Windows: Settings → Time & language → Language → เพิ่ม 한국어 พร้อม Speech) แล้วเปิดเบราว์เซอร์ใหม่",
    silent: "ส่งคำสั่งเล่นเสียงแล้วแต่ไม่มีเสียงออก — ลองเปิดหน้านี้ในแท็บใหม่ และตรวจว่าเครื่องมีเสียงภาษาเกาหลี",
    "not-allowed": "เบราว์เซอร์บล็อกเสียง — แตะที่หน้าเว็บหนึ่งครั้งแล้วกดใหม่",
    "language-unavailable": "ไม่มีเสียงภาษาเกาหลีในเครื่อง — ติดตั้งเสียงเกาหลีในการตั้งค่าระบบ แล้วเปิดเบราว์เซอร์ใหม่",
    "voice-unavailable": "เสียงภาษาเกาหลีในเครื่องใช้งานไม่ได้ — ลองรีเฟรชหน้า",
    "synthesis-failed": "ระบบเสียงของเครื่องทำงานผิดพลาด — ลองรีเฟรชหน้า",
    "audio-busy": "อุปกรณ์เสียงกำลังถูกใช้งานอยู่ — ลองใหม่อีกครั้ง",
  }[reason] || `เล่นเสียงไม่ได้ (${esc(reason)}) — ลองรีเฟรชหน้า`;
  toast(`🔇 <span class="th">${msg}</span>`, 6000);
}
Speech.init();
document.addEventListener("click", e => {
  const b = e.target.closest("[data-say]");
  if (b) { e.preventDefault(); e.stopPropagation(); Speech.play(b.dataset.say); }
}, true);

/* progress (Leitner 0–5) */
const INTERVAL = [0, 1, 2, 4, 7, 14], DAY = 86400000;
const P = store.get("ksf-progress-v1", {w: {}, g: {}, days: {}});
P.g = P.g || {};
const saveP = () => store.set("ksf-progress-v1", P);
function grade(no, ok) {
  const cur = P.w[no] || {b: 0};
  const b = ok ? Math.min(cur.b + 1, 5) : 0;
  P.w[no] = {b, due: Date.now() + INTERVAL[b] * DAY};
  saveP();
}
const learned = no => (P.w[no]?.b || 0) >= 1;       // ตอบ "Got it" อย่างน้อย 1 ครั้ง = เรียนแล้ว
const dueList = () => WORDS.filter(w => P.w[w.no] && P.w[w.no].due <= Date.now() && P.w[w.no].b < 5);
const unseen = () => WORDS.filter(w => !P.w[w.no]);

/* router */
const state = {
  tab: "home",
  vocab: {q: "", tiers: new Set(["A", "B"]), pos: "", listen: false, view: "list", shown: 50, idx: 0, flipped: false, open: new Set(), shuffled: null},
  gram: {cat: "", q: "", tiers: new Set(["A", "B", "C", "D"]), open: new Set()},
  practice: {mode: "ko2th", scope: "AB", n: 10, run: null},
  session: null,
};
document.getElementById("tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) go(b.dataset.tab); };
let keyHandler = null, quizKeys = null;
function go(tab) {
  state.tab = tab;
  const r = state.practice.run;
  if (r && r.i >= r.qs.length) state.practice.run = null;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  keyHandler = quizKeys = null;
  render(); window.scrollTo({top: 0});
}
const render = () => ({home: renderHome, vocab: renderVocab, grammar: renderGrammar, practice: renderPractice})[state.tab]();

/* ======================================================
   VOCABULARY
   ====================================================== */
const POS_LIST = [...new Set(WORDS.map(w => w.pt))];
function filteredWords() {
  const v = state.vocab, q = v.q.trim().toLowerCase();
  return WORDS.filter(w => v.tiers.has(w.tier) && (!v.pos || w.pt === v.pos) && (!v.listen || w.lf) &&
    (!q || w.ko.includes(q) || w.th.toLowerCase().includes(q) || w.en.toLowerCase().includes(q)));
}
function meaningBlock(w) {
  return `<div class="means">
    <span class="label">Thai</span><span class="v">${w.th ? TH(w.th) : `<span class="stat">— (not translated yet)</span>`}</span>
    <span class="label">English</span><span class="v">${esc(w.en) || "—"}</span>
    <span class="label">Type</span><span class="v">${esc(posEn(w))} <span class="stat ko">${esc(w.pk)}</span></span>
  </div>`;
}
function examplesBlock(w) {
  if (!w.ex.length) return `<div class="stat">No example sentence from the exams yet.</div>`;
  const translated = w.ex.filter(e => e.th);
  const list = translated.length ? translated.slice(0, 2) : w.ex.slice(0, 1);
  return `<div class="exs">${list.map(exampleHTML).join("")}</div>`;
}
function vocabItem(w) {
  const open = state.vocab.open.has(w.no);
  return `<details class="card vitem" data-no="${w.no}" ${open ? "open" : ""}>
    <summary class="vsum">
      <span class="rank">#${w.rank}</span>
      <span class="vword">${esc(w.ko)}</span>${sayBtn(w.ko)}
      <span class="pos">${esc(posEn(w))}</span>${tierBadge(w.tier)}${listenBadge(w)}
      ${learned(w.no) ? '<span class="stat">✓ learned</span>' : ""}
      <span class="chev">▾</span>
    </summary>
    <div class="vbody">
      ${meaningBlock(w)}
      <div class="stat">Appears in ${w.ec}/${NEX} exams · ${w.fq} times (${lrText(w)})</div>
      ${w.ref ? `<a class="src-link" href="${esc(w.ref)}" target="_blank" rel="noopener">Thai meaning checked with krdict (국립국어원) ↗</a>` : ""}
      <div><div class="label" style="margin-bottom:6px">Examples</div>${examplesBlock(w)}</div>
    </div>
  </details>`;
}
function renderVocab() {
  const v = state.vocab, list = filteredWords();
  $app.innerHTML = `
    <h1>Vocabulary</h1>
    <p class="sub">Sorted from most to least frequent in ${NEX} real TOPIK I exams. Tap a word to see its meaning.</p>
    <div class="toolbar">
      <div class="row">
        <input type="search" id="vq" placeholder="Search: 한국어 / English / ไทย" value="${esc(v.q)}" aria-label="Search words">
        <select id="vpos" aria-label="Word type"><option value="">All word types</option>${POS_LIST.map(p => `<option value="${esc(p)}" ${p === v.pos ? "selected" : ""}>${esc(POS_EN[p] || p)}</option>`).join("")}</select>
        <div class="seg" role="group" aria-label="View">
          <button data-view="list" aria-pressed="${v.view === "list"}">☰ List</button>
          <button data-view="card" aria-pressed="${v.view === "card"}">🂠 Flashcards</button>
        </div>
      </div>
      <div class="row">${Object.keys(TIERS).map(t =>
        `<button class="chip t${t}" data-tier="${t}" aria-pressed="${v.tiers.has(t)}" title="${TIERS[t].th} — ${TIERS[t].desc}"><span class="star">${TIERS[t].star}</span> ${TIERS[t].label} <span class="stat">${WORDS.filter(w => w.tier === t).length}</span></button>`).join("")}
        <button class="chip" id="vlisten" aria-pressed="${v.listen}" title="Words heard mostly in the listening section">🎧 Listening <span class="stat">${WORDS.filter(w => w.lf).length}</span></button>
        <span style="margin-left:auto" class="row">
          ${v.view === "list" ? `<button class="btn sm" id="expandAll">${v.open.size ? "Collapse all" : "Expand all"}</button>` : ""}
          <span class="stat" id="vcount">${list.length} words</span>
        </span>
      </div>
    </div>
    <div id="vbody"></div>`;
  const q = document.getElementById("vq");
  q.oninput = () => { v.q = q.value; v.shown = 50; v.idx = 0; v.shuffled = null; drawVocabBody(); };
  document.getElementById("vpos").onchange = e => { v.pos = e.target.value; v.shown = 50; v.idx = 0; v.shuffled = null; renderVocab(); };
  $app.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { v.view = b.dataset.view; v.flipped = false; renderVocab(); });
  $app.querySelectorAll("[data-tier]").forEach(b => b.onclick = () => {
    const t = b.dataset.tier;
    v.tiers.has(t) ? v.tiers.delete(t) : v.tiers.add(t);
    if (!v.tiers.size) v.tiers.add(t);
    v.shown = 50; v.idx = 0; v.shuffled = null; renderVocab();
  });
  document.getElementById("vlisten").onclick = () => { v.listen = !v.listen; v.shown = 50; v.idx = 0; v.shuffled = null; renderVocab(); };
  const ea = document.getElementById("expandAll");
  if (ea) ea.onclick = () => {
    if (v.open.size) v.open.clear(); else filteredWords().slice(0, v.shown).forEach(w => v.open.add(w.no));
    renderVocab();
  };
  drawVocabBody();
}
function drawVocabBody() {
  const v = state.vocab, list = filteredWords(), box = document.getElementById("vbody");
  document.getElementById("vcount").textContent = `${list.length} words`;
  if (!list.length) { box.innerHTML = `<div class="empty">No words found.</div>`; return; }
  if (v.view === "card") {
    const cards = v.shuffled || list;
    drawFlashcards(box, cards, {idx: v.idx, flipped: v.flipped, onGrade: null,
      setIdx: i => v.idx = i, setFlipped: b => v.flipped = b,
      onShuffle: () => { v.shuffled = shuffle(list); v.idx = 0; v.flipped = false; drawVocabBody(); toast("Cards shuffled"); }});
    return;
  }
  box.innerHTML = `<div class="vlist">${list.slice(0, v.shown).map(vocabItem).join("")}</div>
    ${list.length > v.shown ? `<div class="more"><button class="btn" id="moreBtn">Show more (${list.length - v.shown})</button></div>` : ""}`;
  box.querySelectorAll("details[data-no]").forEach(d => d.ontoggle = () => { const n = +d.dataset.no; d.open ? v.open.add(n) : v.open.delete(n); });
  const more = document.getElementById("moreBtn");
  if (more) {
    more.onclick = () => { v.shown += 60; drawVocabBody(); };
    const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { io.disconnect(); more.click(); } }, {rootMargin: "400px"});
    io.observe(more);
  }
}

/* flashcards: opts = {idx, flipped, setIdx, setFlipped, onGrade | null, onShuffle | null} */
function cardHTML(w, flipped) {
  const ex = w.ex[0];
  return `<div class="fc${flipped ? " flipped" : ""}" id="fc" role="button" tabindex="0" aria-label="Flip card">
    <div class="fc-inner">
      <div class="card fc-face">
        <div class="row" style="justify-content:center">${tierBadge(w.tier)}<span class="stat">#${w.rank}</span></div>
        <div class="fc-word">${esc(w.ko)}</div>
        ${sayBtn(w.ko)}
        <div class="fc-hint">Tap the card to see the meaning</div>
      </div>
      <div class="card fc-face fc-back">
        <div class="row" style="justify-content:center"><span class="ko" style="font-size:1.6rem">${esc(w.ko)}</span>${sayBtn(w.ko)}</div>
        <span class="pos">${esc(posEn(w))} · <span class="ko">${esc(w.pk)}</span></span>
        ${w.th ? `<div class="fc-mean">${TH(w.th)}</div>` : ""}
        <div style="font-size:1.05rem">${esc(w.en)}</div>
        ${ex ? `<div style="text-align:left;width:100%">${exampleHTML(ex)}</div>` : ""}
        <div class="stat">Appears in ${w.ec}/${NEX} exams · ${w.fq} times (${lrText(w)})</div>
      </div>
    </div>
  </div>`;
}
function drawFlashcards(box, list, opts) {
  const idx = Math.min(opts.idx, list.length - 1), w = list[idx], session = !!opts.onGrade;
  box.innerHTML = `<div class="fc-wrap">
    <div class="progress"><i style="width:${((idx + 1) / list.length) * 100}%"></i></div>
    <div class="row" style="justify-content:space-between"><span class="stat">${idx + 1} / ${list.length}</span><span class="kbd">Space = flip · ←/→ = move · 1/2 = grade</span></div>
    ${cardHTML(w, opts.flipped)}
    <div class="fc-grade">
      <button class="btn no" data-grade="0">✗ Not yet</button>
      <button class="btn yes" data-grade="1">✓ Got it</button>
    </div>
    ${session ? "" : `<div class="fc-nav">
      <button class="btn" data-nav="-1" ${idx === 0 ? "disabled" : ""}>← Previous</button>
      <button class="btn" data-nav="shuffle">🔀 Shuffle</button>
      <button class="btn" data-nav="1" ${idx === list.length - 1 ? "disabled" : ""}>Next →</button>
    </div>`}
  </div>`;
  const redraw = () => drawFlashcards(box, list, opts);
  const move = d => { const i = idx + d; if (i < 0 || i >= list.length) return; opts.setIdx(i); opts.setFlipped(false); opts.idx = i; opts.flipped = false; redraw(); };
  const fc = document.getElementById("fc");
  const flip = () => { opts.flipped = !opts.flipped; opts.setFlipped(opts.flipped); fc.classList.toggle("flipped", opts.flipped); };
  fc.onclick = flip;
  const doGrade = ok => {
    grade(w.no, ok);
    if (session) return opts.onGrade(ok);
    if (idx < list.length - 1) move(1); else toast("You've reached the last card 🎉");
  };
  box.querySelectorAll("[data-grade]").forEach(b => b.onclick = () => doGrade(b.dataset.grade === "1"));
  box.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => b.dataset.nav === "shuffle" ? opts.onShuffle() : move(+b.dataset.nav));
  keyHandler = e => {
    if (e.target.matches("input,select,textarea")) return;
    if (e.key === " ") { e.preventDefault(); flip(); }
    else if (e.key === "1") doGrade(false);
    else if (e.key === "2") doGrade(true);
    else if (!session && e.key === "ArrowRight") move(1);
    else if (!session && e.key === "ArrowLeft") move(-1);
  };
}
document.addEventListener("keydown", e => { if (keyHandler && document.getElementById("fc")) keyHandler(e); });

      </div>

      <div class="row"><span class="pos">${esc(CAT_EN[g.cat] || g.cat)}</span><span class="stat">${g.no ? `No. ${g.no} in the grammar list` : "Not in the list — but common in the exams"}</span></div>
      <div class="gform">${TH(g.exp)}</div>
      <div class="label">Examples</div>
      ${g.ex.map(e => `<div class="ex">${sayBtn(e.ko, true)}<div><div class="s">${esc(e.ko)}</div><div class="src">${e.en ? esc(e.en) + " · " : ""}${TH(e.th)}</div></div></div>`).join("")}
      ${g.xex.length ? `<div class="label">From real exams</div>` + g.xex.map(e => `<div class="ex">${sayBtn(e.ko, true)}<div><div class="s">${esc(e.ko)}</div><div class="src">TOPIK I · Exam ${esc(e.src.replace(/\D/g, ""))}</div></div></div>`).join("") : ""}
      ${grp}
      ${g.ec < 3 ? `<div class="stat">ℹ︎ Mostly spoken — <span class="th">ใช้บ่อยในบทสนทนา แต่ข้อสอบที่มีไม่มีสคริปต์พาร์ตฟัง จึงนับได้น้อย</span></div>` : ""}

const MODES = {
  ko2th:  {name: "Word → Meaning", desc: "See the Korean word, pick its meaning"},
  th2ko:  {name: "Meaning → Word", desc: "See the meaning, pick the Korean word"},
  listen: {name: "Listening",      desc: "Listen, then pick the word you heard"},
  gram:   {name: "Grammar",        desc: "Fill in the blank / pick the meaning"},
};
const tierScope = scope => scope === "A" ? ["A"] : scope === "AB" ? ["A", "B"] : ["A", "B", "C"];
const poolFor = scope => WORDS.filter(w => tierScope(scope).includes(w.tier));
function vocabQuestion(w, mode, pool) {
  const same = pool.filter(x => x.no !== w.no && x.pt === w.pt && meaningText(x) !== meaningText(w) && x.ko !== w.ko);
  const others = sample(same.length >= 3 ? same : pool.filter(x => x.no !== w.no), 3);
  const opts = shuffle([w, ...others]), ans = opts.indexOf(w);
  if (mode === "ko2th") return {kind: mode, word: w, promptHTML: `<span class="big">${esc(w.ko)}</span>${sayBtn(w.ko)}`, opts: opts.map(o => o.th ? TH(o.th) + ` <span class="stat">· ${esc(o.en)}</span>` : esc(o.en)), html: true, ans};
  if (mode === "th2ko") return {kind: mode, word: w, promptHTML: `${w.th ? `<div style="font-size:1.4rem">${TH(w.th)}</div>` : ""}<div>${esc(w.en)}</div><div class="stat">${esc(posEn(w))}</div>`, opts: opts.map(o => esc(o.ko)), html: true, ans, koOpts: true};
  return {kind: mode, word: w, promptHTML: `<div class="stat" style="margin-bottom:8px">Tap to listen, then choose the word (tap again = slower)</div><button class="say" style="width:64px;height:64px;font-size:1.6rem" data-say="${esc(w.ko)}">🔊</button>`, opts: opts.map(o => esc(o.ko)), html: true, ans, koOpts: true, autoplay: w.ko};
}
function gramQuestion(g) {
  if (g.quiz) {
    const order = shuffle(g.quiz.opts.map((o, i) => i));
    return {kind: "gram", gram: g, promptHTML: `<div class="stat" style="margin-bottom:6px">Fill in the blank</div><span class="ko" style="font-size:1.35rem">${esc(g.quiz.q)}</span><div class="stat" style="margin-top:6px">${TH(g.quiz.th)}</div>`,
            opts: order.map(i => esc(g.quiz.opts[i])), html: true, ans: order.indexOf(g.quiz.ans), koOpts: true, answerText: g.quiz.opts[g.quiz.ans]};
  }
  const others = sample(GRAMMAR.filter(o => o.id !== g.id && o.th !== g.th && !g.group.includes(o.no) && o.p !== g.p), 3);
  const opts = shuffle([g, ...others]), ex = g.ex[0];
  return {kind: "gram", gram: g,
          promptHTML: `<div class="stat">What does this grammar mean?</div><span class="ko" style="font-size:1.6rem;display:block">${esc(g.p)}</span>${ex ? `<div class="stat ko" style="margin-top:6px">${esc(ex.ko)}</div>` : ""}`,
          opts: opts.map(o => TH(o.th) + (o.en ? ` <span class="stat">· ${esc(o.en)}</span>` : "")), html: true, ans: opts.indexOf(g), answerText: g.th};
}
function buildQuiz(mode, scope, n, fixedWords) {
  if (mode === "gram") {
    const tiers = scope === "A" ? ["A"] : scope === "AB" ? ["A", "B"] : ["A", "B", "C", "D"];
    const pool = GRAMMAR.filter(g => tiers.includes(g.tier));
    return sample(pool, Math.min(n, pool.length)).map(gramQuestion);
  }
  const pool = poolFor(scope);
  const targets = fixedWords?.length ? sample(fixedWords, Math.min(n, fixedWords.length)) : sample(pool, n);
  return targets.map(w => vocabQuestion(w, mode, pool.length > 10 ? pool : WORDS));
}

function drawQuiz(box, run, onExit, exitLabel = "Back to practice") {
  if (run.i >= run.qs.length) {
    const pct = Math.round(run.score / run.qs.length * 100);
    box.innerHTML = `<div class="quiz"><div class="card qcard" style="text-align:center">
      <div style="font-size:2.4rem">${pct >= 80 ? "🎉" : pct >= 50 ? "👍" : "💪"}</div>
      <h2 style="margin:0">${run.score} / ${run.qs.length} correct (${pct}%)</h2>
      ${run.points ? `<div class="stat">Points ${run.got} / ${run.points}${run.scaled ? ` · scaled to 200: <b>${run.scaled()}</b> → ${run.level()}` : ""}</div>` : ""}
      ${run.wrong.length ? `<div style="text-align:left;display:grid;gap:6px"><div class="label">Review these</div>${run.wrong.map(q => q.exq
        ? `<div class="ex"><div><div class="s">TOPIK I · Exam ${esc(q.exq.exam.replace(/\D/g, ""))} · No. ${q.exq.q}</div><div class="src">${esc(q.exq.tEn)} — answer: ${"①②③④"[q.exq.ans - 1]}</div></div></div>`
        : q.word
        ? `<div class="ex">${sayBtn(q.word.ko, true)}<div><div class="s">${esc(q.word.ko)}</div><div class="src">${q.word.th ? TH(q.word.th) + " · " : ""}${esc(q.word.en)}</div></div></div>`
        : `<div class="ex"><div><div class="s">${esc(q.gram.p)}</div><div class="src">${TH(q.gram.th)} — answer: <span class="ko">${esc(q.answerText)}</span></div></div></div>`).join("")}</div>` : ""}
      <button class="btn primary" id="qExit">${exitLabel}</button>
    </div></div>`;
    document.getElementById("qExit").onclick = onExit;
    return;
  }
  const q = run.qs[run.i];
  box.innerHTML = `<div class="quiz">
    <div class="progress"><i style="width:${(run.i / run.qs.length) * 100}%"></i></div>
    <div class="row" style="justify-content:space-between"><span class="stat">Question ${run.i + 1} / ${run.qs.length}</span><span class="stat">Correct ${run.score}</span></div>
    <div class="card qcard">
      <div class="qprompt">${q.promptHTML}</div>
      <div class="qopts">${q.opts.map((o, i) => `<button class="qopt${q.koOpts ? " ko" : ""}" data-i="${i}"><span class="stat">${i + 1}.</span> ${o}</button>`).join("")}</div>
      <div class="qfeed" id="qfeed"></div>
      <button class="btn primary" id="qNext" style="display:none">Next →</button>
    </div>
  </div>`;
  if (q.autoplay) setTimeout(() => Speech.play(q.autoplay), 250);
  const answer = i => {
    if (run.answered) return;
    run.answered = true;
    const ok = i === q.ans;
    box.querySelectorAll(".qopt").forEach((b, j) => { b.disabled = true; if (j === q.ans) b.classList.add("right"); else if (j === i) b.classList.add("wrong"); });
    if (ok) run.score++; else run.wrong.push(q);
    if (q.exq && ok) run.got = (run.got || 0) + (q.exq.pts || 0);
    if (q.word) grade(q.word.no, ok);
    if (q.gram && ok) { P.g[q.gram.id] = 1; saveP(); }
    document.getElementById("qfeed").innerHTML = q.exq ? examFeedback(q, ok) : ok ? "✓ Correct!" : q.word
      ? `✗ Answer: <b class="ko">${esc(q.word.ko)}</b> — ${q.word.th ? TH(q.word.th) + " · " : ""}${esc(q.word.en)} ${sayBtn(q.word.ko, true)}`
      : `✗ Answer: <b class="ko">${esc(q.answerText)}</b> — <span class="ko">${esc(q.gram.p)}</span>: ${TH(q.gram.th)}`;
    const nx = document.getElementById("qNext");
    nx.style.display = "block"; nx.focus();
    nx.onclick = () => { run.i++; run.answered = false; drawQuiz(box, run, onExit, exitLabel); };
  };
  box.querySelectorAll(".qopt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  keyHandler = null;
  quizKeys = e => {
    if (!document.querySelector(".qopts")) return;

  };
}

// เส้นจำนวน: แกน 0 → total แบ่งช่วงตาม tier, ตัวชี้ = จำนวนที่เรียนแล้ว
function numberLine({title, unit, items, isDone}) {
  const total = items.length, done = items.filter(isDone).length;
  const bounds = []; let acc = 0;
  for (const t of ["A", "B", "C", "D"]) { const n = items.filter(x => x.tier === t).length; if (n) { bounds.push({t, n, from: acc, to: acc + n}); acc += n; } }
  const pct = x => (x / total * 100).toFixed(2) + "%";
  const next = bounds.find(b => items.filter(x => x.tier === b.t && isDone(x)).length < b.n);
  const nextMsg = next
    ? `Next milestone: finish <b>${TIERS[next.t].label}</b> ${unit} — ${next.n - items.filter(x => x.tier === next.t && isDone(x)).length} to go`
    : `All ${unit} done 🎉`;
  return `<div class="card nl">
    <div class="nl-head"><span class="label">${title}</span></div>
    <div class="nl-head"><span class="nl-big">${done}</span><span class="stat">/ ${total} ${unit} learned</span></div>
    <div class="nl-wrap">
      <div class="nl-marker" style="left:clamp(34px, ${pct(done)}, calc(100% - 34px))"><b>You: ${done}</b><i></i></div>
      <div class="nl-track">${bounds.map(b => `<span class="s${b.t}" style="width:${pct(b.n)}" title="${TIERS[b.t].label}: ${b.n}"></span>`).join("")}</div>
      <div class="nl-fill" style="width:${pct(done)}"></div>
    </div>
    <div class="nl-ticks"><span class="nl-tick" style="left:0">0</span>${bounds.filter((b, i) => i === bounds.length - 1 || (total - b.to) / total >= 0.05)
        .map(b => `<span class="nl-tick" style="left:${pct(b.to)}">${b.to}</span>`).join("")}</div>
    <div class="nl-legend">${bounds.map(b => {
      const d = items.filter(x => x.tier === b.t && isDone(x)).length;
      return `<span>${tierBadge(b.t)} ${d}/${b.n}</span>`; }).join("")}</div>
    <div class="stat">${nextMsg}</div>
  </div>`;
}

      ? buildQuiz("ko2th", "AB", Math.min(10, words.length), words).map((q, i) => i % 3 === 1 ? vocabQuestion(q.word, "th2ko", poolFor("ABC")) : i % 3 === 2 ? vocabQuestion(q.word, "listen", poolFor("ABC")) : q)
      : buildQuiz("ko2th", "AB", 10);
    s.quiz = {qs, i: 0, score: 0, wrong: [], answered: false};
  }
  drawQuiz(box, s.quiz, next, "Finish session →");
}
